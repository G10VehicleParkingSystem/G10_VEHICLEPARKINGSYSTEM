name: Backend CI

on:
  push:
    branches: [main, feature/fr2-fr7-final]
  pull_request:
    branches: [main]

jobs:
  backend-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: |
          node --check server.js
          node --check src/modules/reservation/reservation.controller.js
          node --check src/modules/reservation/reservation.service.js
          node --check src/modules/notification/notification.controller.js
          node --check src/modules/notification/notification.service.js
